<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brainless">
<meta name="theme-color" content="#0b0d14">
<title>Brainless</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    --sat: env(safe-area-inset-top); --sar: env(safe-area-inset-right);
    --sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0d14;
    position: fixed; inset: 0; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  canvas {
    display: block; position: absolute; left: 0; top: 0;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #loading {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0b0d14; color: #f6a6bd; font: bold 22px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 4px;
  }
  #loading small { color: #8a93b8; font-size: 11px; letter-spacing: 2px; margin-top: 10px; }
  #track { width: 180px; height: 8px; margin-top: 18px; background: #1d2133; border: 2px solid #2e3450; }
  #bar { width: 0; height: 100%; background: #d8678a; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">BRAINLESS<small>CUISSON DES SPRITES…</small><div id="track"><div id="bar"></div></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
